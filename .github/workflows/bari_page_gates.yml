# Bari page-gate battery (TASK-505) — CI-resident deterministic gates.
# Runs the spine conformance sweep + an OFF-ban census on every PR that touches
# comparison data or the page generator. These gates already exist locally; this
# workflow makes them fire even when nobody remembers to run them (audit finding:
# "everything fires interactively only").
name: Bari Page Gates

on:
  pull_request:
    paths:
      - "bari-web/src/data/comparisons/**"
      - "bari-web/src/data/seo/**"
      - "03_operations/page_generator/**"
      - "03_operations/spine/**"
      - "02_products/**"
      - ".github/workflows/bari_page_gates.yml"
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      # Runs on the ubuntu runner, which is the whole point: it asserts that the configs'
      # absolute C:\Bari literals re-anchor onto the checkout under POSIX (TASK-560).
      - name: Config path re-anchoring tests
        run: python -m pytest 03_operations/page_generator/test_conformance_paths.py -v --tb=short

      # Protective gate (TASK-560): fails on a NEW non-conforming shelf, on an excepted
      # shelf whose failures drift, and on a stale exception -- but not on the documented
      # standing exceptions in conformance_exceptions.json (each pinned to an owning task).
      # A permanently-red job teaches everyone to ignore it; a regression must still bite.
      - name: Spine conformance gate (regression-protective)
        run: python 03_operations/page_generator/conformance_gate.py

  off-ban-census:
    # OFF is banned project-wide (CLAUDE.md hard rule, TASK-238). Any OFF reference
    # reaching consumer-facing data or site source is a launch blocker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Census — no OFF references in site source or comparison data
        run: |
          set -e
          MATCHES=$(grep -rniE "openfoodfacts" bari-web/src/ 2>/dev/null | grep -viE "banned|forbidden|do not use|never use" || true)
          if [ -n "$MATCHES" ]; then
            echo "OFF-ban violation(s) found (launch blocker, TASK-238):"
            echo "$MATCHES"
            exit 1
          fi
          echo "OFF census clean: no Open Food Facts references in bari-web/src/."
