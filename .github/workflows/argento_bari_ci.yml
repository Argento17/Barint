name: CI — Argento17/bari (deploy repo)

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate corpus (all datasets, error mode)
        run: node scripts/validate-corpus.mjs --all --handoff
