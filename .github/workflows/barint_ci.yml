name: CI — Barint

on:
  pull_request:
    paths:
      - "bari-web/src/**"
      - "bari-web/scripts/**"
      - "bari-web/package.json"
      - "bari-web/next.config.ts"
      - "bari-web/tsconfig.json"
      - "bari-web/eslint.config.mjs"
      - "03_operations/**"
      - ".github/workflows/barint_ci.yml"
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bari-web
    steps:
      - uses: actions/checkout@v4

      # TASK-579: bumped 20 -> 24. validate-card-stats.mjs dynamic-imports
      # src/lib/derived/comparison-card-stats.ts directly (no build step) and relies on
      # Node's native TypeScript type-stripping, which does not exist on Node 20 at all
      # (a bare .ts import fails immediately with ERR_UNKNOWN_FILE_EXTENSION) and needs
      # >=23.6 to run flag-free (or >=22.6 with --experimental-strip-types). 24 matches
      # the version this was verified against locally. Next 16.2.6 / this job's other
      # steps have no Node-20-specific dependency, so this is a same-job version bump,
      # not a broader infra change.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bari-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript + Next build
        run: npm run build

      - name: ESLint
        run: npm run lint

      # dev mode: live-category failures warn (972-error backlog = TASK-462 follow-up under owner copy freeze); new/un-wired datasets still hard-fail. --handoff stays the manual handoff gate.
      - name: Validate corpus (all datasets, dev mode)
        run: node scripts/validate-corpus.mjs --all

      # TASK-579: parity fixture for /hashvaot featured-card derived stats — re-derives
      # ComparisonCardStats straight from the raw comparison JSON via the real shared
      # module (src/lib/derived/comparison-card-stats.ts), not a reimplementation.
      - name: Validate featured-card derived stats
        run: npm run validate-card-stats

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pytest beautifulsoup4 lxml

      - name: BSIP0 nutrition tests (20)
        run: python -m pytest 03_operations/bsip0/scrape/_shared/test_bsip0_nutrition.py -v --tb=short

      - name: BSIP1 enricher tests (64)
        run: python 03_operations/bsip1/core/test_enricher.py

      - name: Router regression
        run: python 03_operations/bsip2/proto_v0/src/run_router_regression.py

      - name: Scoring regression (golden corpus)
        run: python 03_operations/bsip2/proto_v0/src/run_regression_check.py

      - name: BSIP0 QA validator tests
        run: python -m pytest 03_operations/bsip0/validators/test_bsip0_qa_validator.py -v --tb=short

      - name: BSIP0 exit gate tests (30)
        run: python 03_operations/bsip0/scrape/_shared/test_bsip0_gate.py

      - name: BSIP0 exit gate — live corpus check
        run: python 03_operations/bsip0/scrape/_shared/bsip0_gate.py 02_products/breakfast_cereals/bsip0_outputs/cereals_bsip0_raw_20260601T152207.json || true

      - name: Spine smoke manifest dry-run (TASK-290)
        run: python 03_operations/spine/smoke_test.py --dry-run

      - name: Live manifest drift check (TASK-466)
        run: python 03_operations/page_generator/live_manifest.py --check

  off-sweep:
    # TASK-238 — OFF is BANNED project-wide. Fail if any Open-Food-Facts marker
    # appears in the frontend data directory (bari-web/src/data/).
    # Mechanises the manual Phase-J check from the QA checklist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OFF-string sweep (bari-web/src/data/)
        run: |
          if grep -riE \
            "openfoodfacts|open_food_facts|off_api|off_candidate_panel|openfoodfacts\.org" \
            bari-web/src/data/; then
            echo "::error::Banned Open-Food-Facts marker found in bari-web/src/data/ (TASK-238). Remove before merge."
            exit 1
          fi
          echo "OFF sweep CLEAN — no banned markers found."

  e2e-smoke:
    # TASK-554 - Playwright smoke + a11y in CI (visual/perf stay manual-only).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bari-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bari-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E
        run: npm run test:e2e
        env:
          CI: true

      - name: A11y E2E
        # Hard gate on serious/critical WCAG 2 A/AA (advisory period ended when the
        # TASK-510 hero-contrast fix merged, PR #95 2026-07-10).
        run: npm run test:a11y
        env:
          CI: true

