# Shadow Gate (TASK-253) — engine backtest on every engine-touching PR.
# Law: 03_operations/shadow/README.md §"CI integration & baseline policy".
# Compares HEAD against the committed APPROVED baseline (baselines/approved/),
# NEVER a self-captured baseline. Until the first `promote`, the gate reports
# itself INACTIVE (warning, not failure).
name: Shadow Gate — engine backtest

on:
  pull_request:
    paths: &engine_paths
      - "03_operations/bsip2/proto_v0/src/score_engine.py"
      - "03_operations/bsip2/proto_v0/src/constants.py"
      - "03_operations/bsip2/proto_v0/src/nova_proxy.py"
      - "03_operations/bsip2/proto_v0/src/signal_extractor.py"
      - "03_operations/bsip2/proto_v0/src/router_v2.py"
      - "03_operations/bsip2/proto_v0/src/evaluation_scope.py"
      - "03_operations/bsip2/proto_v0/src/input_loader.py"
      - "03_operations/bsip2/proto_v0/src/structural_classifier.py"
      - "03_operations/bsip2/proto_v0/src/trace_writer.py"
      - "03_operations/shadow/**"
      - ".github/workflows/shadow_gate.yml"
  # Direct push-to-master = live Vercel deploy; gate must run on that path too (TASK-554).
  push:
    branches: [master]
    paths: *engine_paths
  workflow_dispatch: {}

jobs:
  shadow-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shadow diff vs APPROVED baseline
        run: |
          set +e
          python 03_operations/bsip2/proto_v0/src/shadow_backtest.py diff --approved \
            --note "CI shadow gate @ ${GITHUB_SHA}"
          code=$?
          set -e
          case "$code" in
            0) echo "Shadow gate: CLEAN — no movement anywhere." ;;
            1) echo "::error::Engine movement detected. Nutrition must sign off on the shadow report (artifact) before merge."
               exit 1 ;;
            2) echo "::error::FROZEN corpus touched, invariant violated, or frozen corpus unverifiable — hard block, no override."
               exit 2 ;;
            3) echo "::warning::Shadow gate INACTIVE — no APPROVED baseline promoted yet. Promote at the next blessed engine state (see 03_operations/shadow/README.md)."
               ;;
            *) echo "::error::Shadow harness failed unexpectedly (exit $code)."
               exit "$code" ;;
          esac

      - name: Gold Set accuracy gate
        # Exit 0 = all pass, 1 = advisories only, 2 = FAILs (finding — non-blocking),
        # 3 = harness error or zero scorable (blocking).
        # Disagreements (exit 2) are FINDINGS for Nutrition Agent review — they never
        # auto-fix the engine and must never block a merge (C3 backdoor ruling P238/P240).
        # PROTECTIVE MODE (TASK-421/W2): run against the Nutrition-adjudicated accepted baseline.
        # Standing disagreements are ACCEPTED engine_divergences and never block; the gate BLOCKS
        # (exit 1) only on a REGRESSION — an accepted PASS/ADVISORY entry that newly FAILs (a real
        # accuracy drop from an engine/data change). This preserves the C3 "findings-not-backdoor"
        # ruling while making the gate genuinely protective.
        run: |
          set +e
          python 03_operations/shadow/goldset/validate_goldset.py
          val_code=$?
          python 03_operations/shadow/goldset/gold_check.py \
            --baseline 03_operations/shadow/goldset/accepted_baseline_v0.json
          gold_code=$?
          set -e
          if [ "$val_code" -ne 0 ]; then
            echo "::error::Gold set schema validation failed (exit $val_code) — seed file is malformed."
            exit "$val_code"
          fi
          case "$gold_code" in
            0) echo "Gold gate: no accuracy regression vs the accepted baseline." ;;
            1) echo "::error::Gold gate: ACCURACY REGRESSION — an accepted entry newly FAILs the gold set. A published-score change moved a product's accuracy. Investigate before merge."
               exit 1 ;;
            3) echo "::error::Gold gate: harness/baseline error or zero scorable entries (exit 3). Fix before merge."
               exit 3 ;;
            *) echo "::error::Gold gate failed unexpectedly (exit $gold_code)."
               exit "$gold_code" ;;
          esac

      - name: Upload shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-report
          path: 03_operations/shadow/runs/
          if-no-files-found: ignore
