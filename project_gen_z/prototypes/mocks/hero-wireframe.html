<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gen Z Hero wireframe</title>
  <style>
    :root { --cream:#F7F7F2; --green:#167A58; --text:#111318; --muted:#4E5663; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--cream); color:var(--text); }
    .banner { background:#fff3cd; border-bottom:1px solid #e6d9a8; padding:.5rem 1rem; font-size:.85rem; text-align:center; }
    .nav { height:56px; border-bottom:1px solid rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.8rem; }
    .hero { max-width:72rem; margin:0 auto; padding:3rem 1.25rem 2rem; text-align:center; }
    .ph { background:repeating-linear-gradient(-45deg,rgba(22,122,88,.06),rgba(22,122,88,.06) 8px,rgba(22,122,88,.12) 8px,rgba(22,122,88,.12) 16px); border:2px dashed var(--green); border-radius:8px; color:var(--green); font-weight:700; font-size:.75rem; }
    .eyebrow { display:inline-block; padding:.35rem 1rem; border-radius:999px; border:1px solid rgba(0,0,0,.08); background:rgba(255,255,255,.7); margin-bottom:1.5rem; }
    h1.ph { font-size:clamp(1.75rem,5vw,3.25rem); padding:1.25rem; margin-bottom:1rem; line-height:1.15; }
    p.ph { max-width:36rem; margin:0 auto 1.75rem; padding:.75rem; }
    .ctas { display:flex; flex-wrap:wrap; gap:.75rem; justify-content:center; margin-bottom:2rem; }
    .btn { padding:.75rem 1.5rem; border-radius:1rem; font-weight:600; border:none; }
    .btn-p { background:var(--green); color:var(--cream); }
    .btn-s { background:rgba(255,255,255,.7); border:1px solid rgba(0,0,0,.08); }
    .trust { display:flex; flex-wrap:wrap; gap:1.5rem; justify-content:center; color:var(--muted); font-size:.9rem; margin-bottom:2.5rem; }
    .trust span { border-bottom:2px dashed #ccc; padding:.25rem; }
    .strip-label { font-size:.8rem; color:var(--muted); margin-bottom:.75rem; }
    .strip { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; padding:1rem 0 2rem; border-top:1px solid rgba(0,0,0,.06); }
    .strip img { width:88px; height:88px; object-fit:contain; background:#fff; border-radius:12px; border:1px solid rgba(0,0,0,.08); padding:6px; }
    .carousel { max-width:72rem; margin:0 auto; padding:2rem 1.25rem 3rem; border-top:1px solid rgba(0,0,0,.06); }
    .carousel-box { height:200px; border-radius:1rem; border:1px solid rgba(0,0,0,.08); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--muted); }
    .foot { text-align:center; padding:1rem; font-size:.8rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="banner">THEORETICAL — Content fills dashed slots. Not production.</div>
  <div class="nav">[ site nav ]</div>
  <section class="hero">
    <div class="eyebrow ph">[ EYEBROW — Content ]</div>
    <h1 class="ph">[ HEADLINE — Content ]</h1>
    <p class="ph">[ SUBLINE — Content ]</p>
    <div class="ctas">
      <button class="btn btn-p ph" type="button">[ CTA PRIMARY ]</button>
      <button class="btn btn-s ph" type="button">[ CTA SECONDARY ]</button>
    </div>
    <div class="trust">
      <span>[ trust_1 ]</span><span>[ trust_2 ]</span><span>[ trust_3 ]</span>
    </div>
    <p class="strip-label">Product strip — scrape URLs (hero-product-strip.json)</p>
    <div class="strip">
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/ARO54_Z_P_7290017962047_1.png" alt="" />
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/KXI28_Z_P_1343845_1.png" alt="" />
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/JDU46_Z_P_7290016245325_1.png" alt="" />
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/JQX30_Z_P_7290011131050_1.png" alt="" />
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/JAY42_Z_P_7290013433091_1.png" alt="" />
    </div>
  </section>
  <div class="carousel"><div class="carousel-box">[ Live carousel P1-02 ]</div></div>
  <p class="foot">01-hero.md · HERO_COPY_DRAFT.md</p>
</body>
</html>
