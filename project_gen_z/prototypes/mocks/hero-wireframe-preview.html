<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gen Z Hero — copy preview (DRAFT)</title>
  <style>
    :root { --cream:#F7F7F2; --green:#167A58; --text:#111318; --muted:#4E5663; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--cream); color:var(--text); }
    .banner { background:#fde8e8; border-bottom:1px solid #e8b4b4; padding:.5rem 1rem; font-size:.85rem; text-align:center; color:#7a2020; }
    .hero { max-width:72rem; margin:0 auto; padding:3rem 1.25rem 2rem; text-align:center; }
    .eyebrow { display:inline-block; padding:.35rem 1rem; border-radius:999px; border:1px solid rgba(0,0,0,.08); background:rgba(255,255,255,.7); color:var(--green); font-weight:600; margin-bottom:1.5rem; }
    h1 { font-size:clamp(1.75rem,5vw,3.25rem); font-weight:800; line-height:1.15; margin-bottom:1rem; }
    .sub { max-width:36rem; margin:0 auto 1.75rem; color:var(--muted); font-size:1.1rem; line-height:1.6; }
    .ctas { display:flex; flex-wrap:wrap; gap:.75rem; justify-content:center; margin-bottom:2rem; }
    .btn { padding:.75rem 1.5rem; border-radius:1rem; font-weight:600; text-decoration:none; font-size:1rem; }
    .btn-p { background:var(--green); color:var(--cream); }
    .btn-s { background:rgba(255,255,255,.7); border:1px solid rgba(0,0,0,.08); color:var(--text); }
    .trust { display:flex; flex-wrap:wrap; gap:1.5rem; justify-content:center; color:var(--muted); font-size:.9rem; margin-bottom:2.5rem; }
    .strip { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; padding:1rem 0 2rem; border-top:1px solid rgba(0,0,0,.06); }
    .strip img { width:88px; height:88px; object-fit:contain; background:#fff; border-radius:12px; border:1px solid rgba(0,0,0,.08); padding:6px; }
  </style>
</head>
<body>
  <div class="banner">DRAFT COPY — Content Agent. Red Team + owner pending. Not production.</div>
  <section class="hero">
    <div class="eyebrow">ניתוח עצמאי · המדף הישראלי</div>
    <h1>ברי מנתחת את המדף הישראלי.<br />כל מוצר לפי הרכיבים שלו בפועל.</h1>
    <p class="sub">בוחנת את ההתאמה בין מה שמוצג על המוצר לבין רשימת הרכיבים שלו.</p>
    <div class="ctas">
      <a class="btn btn-p" href="#">ראו את הממצאים</a>
      <a class="btn btn-s" href="#">כך ברי עובדת</a>
    </div>
    <div class="trust">
      <span>עצמאי ממותגים</span>
      <span>ניתוח לפי רכיבים</span>
      <span>פתוח לכולם</span>
    </div>
    <div class="strip">
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/ARO54_Z_P_7290017962047_1.png" alt="" />
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/KXI28_Z_P_1343845_1.png" alt="" />
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/JDU46_Z_P_7290016245325_1.png" alt="" />
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/JQX30_Z_P_7290011131050_1.png" alt="" />
      <img src="https://res.cloudinary.com/shufersal/image/upload/f_auto,q_auto/v1551800922/prod/product_images/products_zoom/JAY42_Z_P_7290013433091_1.png" alt="" />
    </div>
  </section>
</body>
</html>
