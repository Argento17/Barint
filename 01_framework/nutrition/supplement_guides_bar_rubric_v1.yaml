  - version: "v1 (display_suppression_rule added)"
    date: "2026-07-04"
    change: >
      Added the display_suppression_rule top-level block. Origin: Product Agent's
      03_operations/reports/product/magnesium_guide_bar_revision_call_v1.md, proposing that a
      bar's per-product badge suppress from the rendered table when its state is 100% uniform
      across the displayed corpus (motivated by magnesium's third_party_verification and
      price_fairness bars both resolving CANNOT-VERIFY for 18/18 products). Nutrition D7
      co-sign granted WITH A REFINEMENT: narrowed the trigger from "any uniform state" to
      "uniform CANNOT-VERIFY only" — a uniform FAIL is a real, actionable, market-wide finding
      that must never be hidden, and a uniform PASS is a determinate positive finding that
      should stay visible; only CANNOT-VERIFY (Bari's own admission of no determination) is
      genuinely redundant when repeated identically per row. Display-only: bucket_logic's 6-bar
      evaluation and the anti-drift invariant (HARD RULE 1) are both explicitly unaffected — no
      numeric aggregation, no new bar-state, no bucket-math change. Full co-sign review:
      01_framework/nutrition/supplement_guides_suppression_rule_cosign_v1.md.
  - version: "v1 (recommendation_tier_mapping added)"
    date: "2026-07-04"
    change: >
      Added the recommendation_tier_mapping top-level block (TASK-504 follow-on). Reviewed
      Product Agent's proposed 4-tier display relabeling
      (03_operations/reports/product/magnesium_guide_recommendation_tiers_v1.md), which
      replaces the pass/flag bucket labels with מומלץ מאוד / מומלץ / טוב / לא מומלץ. RULED
      Product's proposed מומלץ/טוב split predicate — count the number of non-PASS displayed
      bars among passes_with_flag members, threshold at 1 (מומלץ) vs >=2 (טוב) — a violation
      of HARD RULE 1: a count-and-threshold computes an implicit point-value-per-bar-state sum
      before comparing it to a cutoff, which is a composite numeric aggregate by construction
      regardless of whether the number is ever stored or shown, and is exactly the
      "point value per bar-state" / rule-accretion pattern the invariant and
      supplement_guides_science_cosign_v1.md §6 tripwire 2 both name. Replaced it with
      dose_adequacy_sole_caveat: a set-membership predicate (is dose_adequacy the ONLY
      non-PASS displayed bar, yes/no — never a cardinality comparison) that reaches the
      IDENTICAL tier split on the current 18-product corpus (2 x מומלץ: Altman Citrate 120,
      Nutricare WELL; 3 x טוב: Supherb Citrate+B6, Altman Bisglycinate, NT L.C. Anti Leg
      Cramps) through a compliant mechanism, and diverges from Product's rule on hypothetical
      future single-non-dose-caveat products — proof it is a genuine qualitative replacement,
      not the same computation relabeled. Co-signed the rest of Product's mapping unchanged:
      clears_all_bars -> מומלץ מאוד (with unconditional, honestly-labeled empty-tier
      rendering), fails -> לא מומלץ, cannot_assess (TRIOMAG) as a separate out-of-tier
      section, ordered tier display with no within-tier sort. Zero numeric fields,
      percentages, or sortable scores introduced anywhere. Product Agent D7 co-sign on the
      amended split rule specifically is still outstanding before this governs live copy.
      Full co-sign review: 01_framework/nutrition/supplement_guides_tier_mapping_cosign_v1.md.
  - version: "v1 (band_gating_exclusion_rule + passes_with_flag_split_rule_v2 added)"
    date: "2026-07-04"
    change: >
      Added band_gating_exclusion_rule (id GATE-EXCL-1) per owner ruling "rank on what
      varies," relayed via Product Agent during TASK-504's creatine domestic band-map review.
      Generalizes display_suppression_rule's 100%-CANNOT-VERIFY trigger to a broader condition
      — a bar is excluded from BAND/TIER GATING (not from display) when no product in the
      ranked pool ever resolves it to PASS, AND no product resolves it to FAIL (the no-FAIL
      clause inherits guardrail_never_hides_a_fail). Kept structurally distinct from
      display_suppression_rule: this rule's effect is narrower (gating only, via a new
      `bandExcludedBars` list) even though its trigger is broader (any non-PASS mix, not just
      uniform CANNOT-VERIFY). RULED to keep the excluded bar fully DISPLAYED — creatine's
      third_party_verification bar carries genuine, heterogeneous per-product claims (9 FLAG +
      14 CANNOT-VERIFY across the 23-product domestic pool, zero PASS, zero FAIL) that a reader
      should still see; only the bar's power to GATE the ranking is removed. Concrete instance:
      creatine's domestic third_party_verification bar excludes from gating; price_fairness,
      form_absorption, dose_adequacy, and label_transparency all retain real PASS instances in
      the domestic pool and stay live gating bars, exactly matching "rank on what varies."

      Also added passes_with_flag_split_rule_v2, superseding v1 (dose_adequacy_sole_caveat)
      wherever a bar is gating-excluded. Fixes an inversion bug in the shipped
      computeRecommendationTier (nonPassDisplayed.length===1 check is false when the set is
      EMPTY, so an all-clear-on-gating-bars product fell through to "good"/C, below a
      dose-only-caveat product in "recommended"/B) by generalizing the split predicate from
      set-EQUALITY (CAVEAT_SET == {dose_adequacy}) to set-SUBSET (CAVEAT_SET ⊆
      {dose_adequacy}) — still a categorical identity test, not a count, per anti_drift_check.
      Ruled מומלץ מאוד/very_recommended stays UNCHANGED (bucket===clears_all_bars, literal 6/6
      PASS) rather than redefined for the domestic pool, so the tier means the same thing
      everywhere; "cleaner ranks above dose-only" is satisfied by a documented, deterministic
      two-group stable ordering WITHIN the מומלץ/B tier, not a new band. Resulting domestic
      creatine distribution: 0 מומלץ מאוד, 10 מומלץ (9 clean + 1 dose-only, in that display
      order), 7 טוב, 4 לא מומלץ, 2 לא ניתן להעריך (of 23) — up from the pre-amendment 0/0/17/4/2
      because 9 products previously miscategorized as טוב (whose only caveat was the
      non-differentiating, now-excluded third-party bar) move to מומלץ. Both new blocks are
      Nutrition-authored D6 proposals; Product Agent D7 co-sign is required before either
      governs live copy.
