# ── KNOWN OPEN GAPS (surfaced, not resolved here) ────────────────────────────
open_gaps:
  - id: "unproven-delivery-technology-claims"
    example: "Nutricare Nano Liposomal Magnesium — 'nano liposomal' delivery-technology claim with insufficient evidence"
    finding: >
      The prior BSIP2-adjacent SIE composite model had a dedicated mechanism (cap_1_insufficient_
      evidence) for an unproven delivery-technology/enhancement claim layered on top of an
      otherwise-known base chemical form. NONE of the 6 bars in this rubric, as scoped by the
      TASK-504A plan, captures this pattern — form_absorption grades the base chemical form
      honestly (bisglycinate = HIGH = PASS) regardless of an unsubstantiated "nano" claim riding
      on top of it.
    recommendation: >
      Flagging for Product + Nutrition follow-up rather than resolving unilaterally: either (a)
      a 7th bar for unsubstantiated delivery/technology claims, or (b) an explicit scope
      extension of label_transparency to cover claims-substantiation, not just dose-disclosure
      completeness. Either is a scope change beyond the approved 6-bar plan and needs its own
      D6/D7 pass, per the anti-drift/no-accretion doctrine — NOT added to this v1 config
      unilaterally. Until resolved, a product with an unsubstantiated technology claim will
      display its true, honest chemical-form bar-state with no bar surfacing the claim itself;
      the claims-discipline rules in creatine_evidence_cosign_v1.md §3 / the science co-sign §3
      still govern what may be SAID in copy about it, independent of this rubric.

