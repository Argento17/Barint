# Hebrew Health Scan — Source Registry v1
# ============================================================================
# Purpose: the curated source universe the daily Hebrew Health Scan reads to
# serve TWO firewalled lanes:
#   LANE A (voice)    — calibrate Bari's natural-Hebrew REGISTER (Project Tom's
#                       Voice, TASK-374). Output = register notes (emulate/avoid),
#                       NEVER harvested phrasings. (Charter rejects RAG over blog
#                       text; file 9 firewall: "blogs teach how Israelis talk about
#                       food, never what's in a product.")
#   LANE B (evidence) — run each finding through the Nutrition Agent's Evidence
#                       Horizon-Scan (label-derivability + already-modelled test).
#                       Output = KB stub / EV proposal / corroboration / declined.
#                       NEVER inherit a blog number/ingredient (OFF ban + file 9).
#
# Owner-supplied list (2026-06-23), curated to lanes by the Nutrition + Content
# agents. 9 of 14 already exist in the Project Comp registry — cross-referenced via
# `comp_ref` (do NOT duplicate Comp's discourse-monitoring job; this is a different
# routine with a different output).
#
# Field contract (per source):
#   id, url, language, source_type, owner_listed(true),
#   voice_lane(high|medium|low|anti_model), evidence_lane(high|medium|low|none),
#   commercial_coi(none|moderate|high : reason), comp_ref(il-### | none),
#   topics[], register_note, firewall_flag
#
# Core principle: a credible CLINICAL source can be weak VOICE; a well-written
# MAINSTREAM source can be weak EVIDENCE. The two lanes are scored separately —
# never let one stand in for the other.
# ============================================================================

meta:
  version: v1
  built: 2026-06-23
  serves: ["TASK-374 (Tom's Voice — register)", "Evidence Horizon-Scan (Nutrition Agent)"]
  source_count: 14
  curation_method: "owner list 2026-06-23; lane-mapped + COI-flagged by Nutrition+Content; cross-ref to comp source_registry_v1.yaml"
  hard_firewalls:
    - "LANE A is register-calibration ONLY. No phrasing is copied into generation. Output = emulate/avoid notes appended to content_voice/tom_bari_voice/9_israeli_food_blog_research.md."
    - "LANE B inherits NO data. Blogs are popular_science_secondary pointers, never a value of record. Facts come only from a product's own BSIP0 scrape (OFF ban). A finding moves a score only via EV-### + D7 (+ owner if it touches published scores)."
    - "Dietitian/prescriptive register ('מומלץ', 'כדאי להפחית') is the ANTI-voice (file 9 §2). Read those sources to REJECT the tone, not to emulate it."
    - "Commercial-COI sources (supplement retailer, food manufacturer, diet-program brand) get their evidence_lane discounted to ~none; read them as 'what the market is being sold', a SIGNAL not a finding."

