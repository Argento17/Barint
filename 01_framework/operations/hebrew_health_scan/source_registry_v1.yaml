    comp_ref: il-001
    topics: [dietary_guidance, ultra_processed, sugar, fiber, food_rainbow, kids_food]
    register_note: >
      Official MoH "אפשרי בריא". Use for what Israeli consumers are formally TAUGHT (label
      literacy, food-rainbow framing) — Bari builds on this literacy. Register is institutional,
      NOT a voice model. Evidence note: MoH *guidance* is policy-credible; MoH *composition data*
